spring:
  application:
    name: workshare
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:workshare}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED&characterEncoding=UTF-8
    username: ${MYSQL_USER:ted}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/mysql
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  web:
    locale: ko_KR
    locale-resolver: fixed
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-private: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  thymeleaf:
    cache: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
app:
  zone: Asia/Seoul
  leave-cutoff: '08:49'
  cafeteria-support-cutoff: '08:49'
  allocation-time: '08:49:10'
  allocation-result-time: '08:50'
  # 예: 5명일 때 기본 방향을 오전 2명, 오후 3명으로 두려면 아래 예시로 교체
  # sharing-shop-quotas:
  #   5:
  #     morning: 2
  #     evening: 3
  sharing-shop-quotas: {}
  admin-username: ${APP_ADMIN_USERNAME:admin}
  admin-password: ${APP_ADMIN_PASSWORD:}
  remember-me-key: ${APP_REMEMBER_ME_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
