spring:
  application:
    name: workshare
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:workshare}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED&characterEncoding=UTF-8
    username: ${MYSQL_USER:ted}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/mysql
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  web:
    locale: ko_KR
    locale-resolver: fixed
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-private: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  thymeleaf:
    cache: true
server:
  port: ${PORT:8080}
  # Behind Cloudflare the app only sees http, so absolute redirects would point browsers at http:// and
  # fetch() refuses to follow them from an https page. A relative Location keeps the page's own scheme.
  tomcat:
    use-relative-redirects: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
app:
  zone: Asia/Seoul
  leave-cutoff: '08:49'
  cafeteria-support-cutoff: '08:49'
  allocation-time: '08:49:10'
  allocation-result-time: '08:50'
  # 2026년 사회복무요원 월 보수(소집월을 1개월째로 이병 1–2, 일병 3–8, 상병 9–14, 병장 15개월부터)
  error-log-directory: ${ERROR_LOG_DIR:logs}
  # 직원별 요청 기록(access.log) 보관 일수
  access-log-days: ${ACCESS_LOG_DAYS:10}
  service-pay:
    monthly-pay:
      PRIVATE: 750000
      PRIVATE_FIRST_CLASS: 900000
      CORPORAL: 1200000
      SERGEANT: 1500000
    daily-meal: 9000
  # 예: 5명일 때 기본 방향을 오전 2명, 오후 3명으로 두려면 아래 예시로 교체
  # sharing-shop-quotas:
  #   5:
  #     morning: 2
  #     evening: 3
  sharing-shop-quotas: {}
  admin-username: ${APP_ADMIN_USERNAME:admin}
  admin-password: ${APP_ADMIN_PASSWORD:}
  remember-me-key: ${APP_REMEMBER_ME_KEY:}
# 오류 모음과 알림. SENTRY_DSN이 비어 있으면 Sentry로 보내지 않고 오류는 로그 파일에만 남는다.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  server-name: ${APP_INSTANCE_NAME:workshare}
  send-default-pii: false
  in-app-includes:
    - com.jangbokhuman.workshare
  context-tags:
    - request
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
