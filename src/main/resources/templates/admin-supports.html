<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지원표 · 장복인간</title><link th:replace="~{fragments/site-layout :: icon}"><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/admin.js}"></script></head><body class="app-page admin-page"><header th:replace="~{admin :: adminHeader}"></header><dialog th:replace="~{admin :: adminMenu}"></dialog><main th:replace="~{fragments/site-layout :: page('admin-shell', ~{::pageContent})}"><th:block th:fragment="pageContent">
<div class="pane-heading"><div><p class="eyebrow">다른 곳에서 함께하는 일</p><h1>지원표</h1><p>매달 받은 표를 날짜별로 입력하세요. 지원 직원은 해당 활동의 오전·오후 배정에서 제외됩니다.</p></div></div>
<div th:if="${success}" class="notice" role="status" th:text="${success}"></div><div th:if="${error}" class="notice danger" role="alert" th:text="${error}"></div>
<section class="card"><form th:action="@{/admin/supports}" method="get" class="support-toolbar"><label>지원·제외 사유<select name="reasonId"><option th:each="reason:${view.reasons}" th:value="${reason.id}" th:text="${reason.name}" th:selected="${view.reason != null && view.reason.id == reason.id}"></option></select></label><label>월<input type="month" name="month" th:value="${view.month}" required></label><button class="button" type="submit">표 보기</button></form>
<details class="panel-disclosure"><summary>제외 사유 추가 <span>＋</span></summary><form th:action="@{/admin/supports/reasons}" method="post" class="stack"><label>활동<select name="activityCode"><option th:each="a:${activities}" th:value="${a.code}" th:text="${a.name}"></option></select></label><label>사유 이름<input name="name" maxlength="60" required placeholder="예: 식당지원, 외부 업무"></label><label>하루 필요 인원<input name="requiredWorkers" type="number" min="0" value="2" required></label><button class="primary" type="submit">사유 추가</button></form></details></section>
<th:block th:if="${view.reason != null}"><section class="card support-setting"><h2 th:text="${view.reason.name + ' 필요 인원'}"></h2><p class="small muted" th:text="${'변경 적용일 · ' + #temporals.format(view.effectiveDate,'yyyy-MM-dd')}"></p><form th:action="@{/admin/supports/requirements}" method="post" class="support-toolbar"><input type="hidden" name="reasonId" th:value="${view.reason.id}"><label>하루 지원 인원<input name="requiredWorkers" type="number" min="0" th:value="${view.required}" required></label><button class="button" type="submit">인원 저장</button></form><p class="small muted">인원을 바꾸어도 기존 지원자는 유지됩니다. 아래 표에서 명단을 함께 확인해주세요.</p></section>
<form th:action="@{/admin/supports/month}" method="post"><input type="hidden" name="reasonId" th:value="${view.reason.id}"><input type="hidden" name="month" th:value="${view.month}"><section class="card support-month"><div class="section-heading"><h2 th:text="${view.month.year + '년 ' + view.month.monthValue + '월'}"></h2><span class="badge working" th:text="${'당일 ' + view.cutoff + ' 마감'}">당일 08:50 마감</span></div><p class="small muted">날짜를 펼쳐 직원을 선택하고 한 번에 저장하세요. 휴가·반차가 있는 직원은 지원자로 저장할 수 없습니다.</p>
<div class="support-day" th:each="day:${view.days}" th:classappend="${!day.working?' support-off':''}"><details name="support-days"><summary><span><strong th:text="${#temporals.format(day.date,'d일 E요일')}"></strong><small th:text="${!day.working?'휴무':(day.names.isEmpty()?'미입력':#strings.listJoin(day.names,', '))}"></small></span><span class="support-count" th:classappend="${day.working && day.selected.size()!=day.required?' mismatch':''}" th:text="${!day.working?'—':day.selected.size()+' / '+day.required+'명'}"></span></summary><div class="support-day-editor" th:if="${day.working}"><input th:if="${day.editable}" type="hidden" name="editedDates" th:value="${#temporals.format(day.date,'yyyy-MM-dd')}"><fieldset class="responsibility-options"><legend>지원 직원 선택</legend><label class="check-label choice-chip" th:each="person:${day.people}"><input type="checkbox" th:name="${'day_'+#temporals.format(day.date,'yyyy-MM-dd')}" th:value="${person.id}" th:checked="${person.selected}" th:disabled="${!day.editable}"><span th:text="${person.name}"></span></label></fieldset><p class="small muted" th:if="${!day.editable}">변경이 마감되었거나 배정이 확정된 날짜입니다.</p></div></details></div>
</section><div class="support-save"><button class="primary" type="submit">이 달 지원표 저장</button></div></form></th:block>
</th:block></main></body></html>
